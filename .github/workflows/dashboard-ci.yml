name: Smart News Dashboard CI

on:
  push:
    branches: [develop/news-agent-mvp]
    paths:
      - "cloudflare/**"
      - "smart_agent/**"
      - "tests/test_smart_agent_worker.py"
      - ".github/workflows/dashboard-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/dashboard-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run
  worker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker test dependencies
        run: python -m pip install pytest "feedparser>=6,<7" "psycopg[binary]>=3.2,<4"
      - name: Install local package metadata
        run: python -m pip install --no-deps -e .
      - name: Compile worker and run focused tests
        run: |
          python -m compileall -q smart_agent
          pytest -q tests/test_smart_agent_worker.py
