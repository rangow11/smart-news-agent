name: Smart News Dashboard CI

on:
  push:
    branches: [develop/news-agent-mvp]
    paths:
      - "cloudflare/**"
      - "smart_agent/**"
      - "tests/test_smart_agent_worker.py"
      - ".github/workflows/dashboard-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/dashboard-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run
  worker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker dependencies
        run: python -m pip install "feedparser>=6,<7"
      - name: Compile worker and validate policy loading
        run: |
          python -m compileall -q smart_agent
          python -c "from smart_agent.worker import CATEGORIES, NEWS_POLICY, SCORING_WEIGHTS, validate_analysis; assert len(CATEGORIES) == 10; assert NEWS_POLICY[\"primary_stream\"][\"daily_limit\"] is None; assert sum(SCORING_WEIGHTS.values()) == 100; validate_analysis({\"news_track\": \"main\", \"category\": CATEGORIES[-1], \"summary\": \"خلاصه با انتساب به منبع\", \"importance\": 90, \"mission_relevance\": 80, \"freshness\": 95, \"is_rumor\": False})"
