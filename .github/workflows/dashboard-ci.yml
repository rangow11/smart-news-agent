name: Smart News Dashboard CI

on:
  push:
    branches: [develop/news-agent-mvp]
    paths:
      - "cloudflare/**"
      - ".github/workflows/dashboard-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/dashboard-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run
