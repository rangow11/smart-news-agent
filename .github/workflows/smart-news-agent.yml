name: Smart News Agent

on:
  push:
    branches: [develop/news-agent-mvp]
    paths:
      - "smart_agent/**"
      - ".github/workflows/smart-news-agent.yml"
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read

concurrency:
  group: smart-news-agent-worker
  cancel-in-progress: false

jobs:
  collect-and-analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install worker dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "feedparser>=6,<7" "psycopg[binary]>=3.2,<4"

      - name: Collect and analyze public RSS reports
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS }}
          NEWS_SOURCES_JSON: ${{ vars.NEWS_SOURCES_JSON }}
        run: python -m smart_agent.worker
